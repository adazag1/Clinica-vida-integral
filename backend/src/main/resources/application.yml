spring:
  application:
    name: clinica-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # Llave HMAC en Base64 (mínimo 32 bytes). Cada perfil la define.
    secret: ${JWT_SECRET:}
    expiracion-minutos: 480
  cors:
    origenes-permitidos: ${CORS_ORIGINS:http://localhost:4200}
  seguridad:
    max-intentos-fallidos: 5
