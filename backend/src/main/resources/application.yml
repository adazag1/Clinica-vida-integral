spring:
  application:
    name: clinica-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # Llave HMAC en Base64 (mínimo 32 bytes). Cada perfil la define.
    secret: ${JWT_SECRET:}
    expiracion-minutos: 480
  cors:
    origenes-permitidos: ${CORS_ORIGINS:http://localhost:4200}
  seguridad:
    max-intentos-fallidos: 5
  # Las franjas de atención y los días de la agenda se interpretan en la hora local de la clínica
  zona-horaria: America/Bogota
  # Dirección del frontend, para los enlaces de confirmación que recibe el paciente (RFAGE-010)
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  recordatorios:
    # Cuántas horas antes de la cita se envía el recordatorio (RFAGE-009)
    horas-antes: 24
  # RFMT-010: rangos de alerta de signos vitales en adultos (deben validarlos los médicos de la clínica).
  # Fuera de normal = alerta amarilla; fuera de crítico = alerta roja.
  signos-vitales:
    presion-sistolica: { normal-min: 90, normal-max: 139, critico-min: 70, critico-max: 219 }
    presion-diastolica: { normal-min: 60, normal-max: 89, critico-min: 40, critico-max: 119 }
    frecuencia-cardiaca: { normal-min: 60, normal-max: 100, critico-min: 40, critico-max: 150 }
    frecuencia-respiratoria: { normal-min: 12, normal-max: 20, critico-min: 8, critico-max: 30 }
    temperatura: { normal-min: 36.0, normal-max: 37.9, critico-min: 35.0, critico-max: 39.9 }
    saturacion-oxigeno: { normal-min: 94, normal-max: 100, critico-min: 89, critico-max: 100 }
  archivos:
    # Tamaño máximo por archivo (imágenes y documentos). Debe coincidir con spring.servlet.multipart.
    max-mb: 10
  pacs:
    # RFRAD-009: visor del PACS de la clínica, con {uid} = StudyInstanceUID (p. ej. OHIF sobre Orthanc:
    # https://pacs.clinica/ohif/viewer?StudyInstanceUIDs={uid}). Vacío = sin PACS conectado.
    visor-url: ${PACS_VISOR_URL:}
  # Resolución 839 de 2017: la historia clínica se conserva 15 años desde la última atención.
  # Deben validarlo el comité de historias clínicas y el área jurídica.
  documentos:
    retencion-anos: 15
  patologia:
    retencion-anos: 15
  # RFRC-009: datos del facturador. Son valores de prueba: los reales vienen de la resolución de
  # facturación de la DIAN y del proveedor tecnológico que contrate la clínica.
  facturacion:
    nit: ${FACTURACION_NIT:900000000}
    razon-social: ${FACTURACION_RAZON_SOCIAL:Clínica Vida Integral (pruebas)}
    prefijo: ${FACTURACION_PREFIJO:FEV}
    clave-tecnica: ${FACTURACION_CLAVE_TECNICA:clave-tecnica-de-pruebas}
    # 1 = producción, 2 = pruebas (habilitación DIAN)
    ambiente: ${FACTURACION_AMBIENTE:2}
    # Días hábiles que tiene la clínica para responder una glosa (Ley 1438 de 2011, art. 57)
    dias-respuesta-glosa: 15
  cartera:
    # RFRC-010: antigüedad (días desde el vencimiento) que dispara una alerta
    umbrales-dias: 30,60,90
  # Épica 4: motor de IA. Las reglas clínicas corren siempre dentro del sistema; el asistente de
  # lenguaje (Azure OpenAI) queda apagado hasta que la clínica apruebe el costo y el tratamiento de datos.
  ia:
    llm:
      habilitado: ${IA_LLM_HABILITADO:false}
      # https://<recurso>.openai.azure.com
      endpoint: ${AZURE_OPENAI_ENDPOINT:}
      deployment: ${AZURE_OPENAI_DEPLOYMENT:}
      api-key: ${AZURE_OPENAI_API_KEY:}
      api-version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      # Precio en USD por 1.000 tokens, para estimar el costo de cada consulta (depende del modelo)
      precio-entrada-1k: ${AZURE_OPENAI_PRECIO_ENTRADA:0.00015}
      precio-salida-1k: ${AZURE_OPENAI_PRECIO_SALIDA:0.0006}
      max-tokens: 700
      timeout-segundos: 40
    dataset:
      # Sal del seudónimo del paciente en el dataset exportado. Vacía = se deriva de la llave JWT.
      sal: ${IA_DATASET_SAL:}
